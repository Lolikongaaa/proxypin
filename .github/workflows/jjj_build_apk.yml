name: JJJ Connector Build

on:
  workflow_dispatch:
  push:
    branches:
      - jjj-connector

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        shell: bash
        run: flutter build apk --release 2>&1 | tee build_output.log; exit ${PIPESTATUS[0]}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jjj-connector-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Auto report failure log
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 150 build_output.log > failure_tail.txt || echo "no build log" > failure_tail.txt
          gh issue create \
            --repo Lolikongaaa/proxypin \
            --title "JJJ build failure auto-report $(date +%Y%m%d-%H%M)" \
            --body-file failure_tail.txt
