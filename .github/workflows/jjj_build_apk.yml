name: JJJ Connector Build

on:
  workflow_dispatch:
  push:
    branches:
      - jjj-connector
    paths-ignore:
      - 'jjj_logs/**'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 上游 main 与 Flutter 3.44.9 配套（作者亲测组合，见 upstream issue #927）；
      # 更新版本会要求 Gradle 8.14+/AGP 8.11+/Kotlin 2.2+ 并损失低版本 Android 兼容
      - name: Setup Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version | tee version_info.log

      - name: Install dependencies
        shell: bash
        run: flutter pub get 2>&1 | tee pub_get.log; exit ${PIPESTATUS[0]}

      - name: Build APK
        shell: bash
        run: flutter build apk --release 2>&1 | tee build_output.log; exit ${PIPESTATUS[0]}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jjj-connector-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 失败时把完整日志直接 push 回仓库（不依赖 artifact API，便于离线诊断）
      - name: Dump logs to repo
        if: failure()
        shell: bash
        run: |
          mkdir -p jjj_logs
          cp build_output.log "jjj_logs/build_${GITHUB_RUN_ID}.log" 2>/dev/null || true
          cp pub_get.log "jjj_logs/pubget_${GITHUB_RUN_ID}.log" 2>/dev/null || true
          cp version_info.log "jjj_logs/version_${GITHUB_RUN_ID}.log" 2>/dev/null || true
          git config user.name "jjj-bot"
          git config user.email "jjj-bot@users.noreply.github.com"
          git add jjj_logs
          git commit -m "chore: dump build logs (run ${GITHUB_RUN_ID})" || echo "nothing to commit"
          git push

      - name: Upload failure log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-log
          path: build_output.log
          if-no-files-found: warn
