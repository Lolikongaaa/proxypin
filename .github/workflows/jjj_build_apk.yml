name: JJJ Connector Build

on:
  workflow_dispatch:
  push:
    branches:
      - jjj-connector
    paths-ignore:
      - 'jjj_logs/**'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        shell: bash
        run: flutter build apk --release 2>&1 | tee build_output.log; exit ${PIPESTATUS[0]}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jjj-connector-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Dump failure log into repo
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p jjj_logs
          tail -n 250 build_output.log > jjj_logs/build_failure.log 2>/dev/null || echo "no build log" > jjj_logs/build_failure.log
          git config user.name "jjj-ci-bot"
          git config user.email "jjj-ci-bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Lolikongaaa/proxypin.git
          git add jjj_logs/build_failure.log
          git commit -m "[JJJ] ci: auto dump failure log"
          git push origin HEAD:jjj-connector
