name: JJJ Connector Build

on:
  workflow_dispatch:
  push:
    branches:
      - jjj-connector
    paths-ignore:
      - 'jjj_logs/**'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 上游 main 与 Flutter 3.44.9 配套（作者亲测组合，见 upstream issue #927）；
      # 更新版本会要求 Gradle 8.14+/AGP 8.11+/Kotlin 2.2+ 并损失低版本 Android 兼容
      - name: Setup Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version | tee version_info.log

      - name: Install dependencies
        shell: bash
        run: flutter pub get 2>&1 | tee pub_get.log; exit ${PIPESTATUS[0]}

      # 上游 android/.gitignore 忽略了 gradlew/gradle-wrapper.jar（仅本地存在），
      # CI 环境无这两个文件，flutter build apk 调用 gradlew 时直接失败；
      # 从 gradle 官方仓库 v8.11.1 tag 拉取配套的 wrapper 三件套补齐
      - name: Ensure gradle wrapper (upstream omits gradlew)
        run: |
          cd android
          curl -fsSL -o gradlew "https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradlew"
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew

      - name: Build APK
        shell: bash
        run: flutter build apk --release 2>&1 | tee build_output.log; exit ${PIPESTATUS[0]}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jjj-connector-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload failure log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-log
          path: build_output.log
          if-no-files-found: warn
